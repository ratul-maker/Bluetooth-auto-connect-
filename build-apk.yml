/**
 * The single place that talks to Android Bluetooth.
 *
 * Everything runs on the main thread. The controller is "active" only while something holds it
 * (the monitoring service, a visible screen, or the Quick Settings tile) - when nobody holds it,
 * all receivers are unregistered and nothing runs.
 *
 * Honest limits (Android 11, no root, public APIs only):
 *  - There is no public API for an app to start an A2DP/headset connection. "Connect" therefore
 *    sends a Bluetooth LE connection request to dual-mode/LE devices and then VERIFIES the real
 *    profile state. For classic-only devices nothing can be requested and the user is told so.
 *  - There is no public API to disconnect a headset, so none is offered.
 *  - Success is only ever reported when Android's profile state says the headset is connected.
 */
public final class BtController {

    public interface Listener {
        void onSnapshot(Snapshot snapshot);
    }

    private static BtController instance;

    public static synchronized BtController get(Context context) {
        if (instance == null) {
            instance = new BtController(context.getApplicationContext());
        }
        return instance;
    }

    // Broadcast used by Android's Bluetooth stack for device battery changes. The constants are
    // not in the public SDK, so the strings are used directly. Only 0..100 is ever accepted.
    private static final String ACTION_BATTERY_LEVEL_CHANGED =
            "android.bluetooth.device.action.BATTERY_LEVEL_CHANGED";
    private static final String EXTRA_BATTERY_LEVEL =
            "android.bluetooth.device.extra.BATTERY_LEVEL";
    private static final int APPLE_COMPANY_ID = 76;

    private static final long STARTUP_SETTLE_MS = 2500L;
    private static final long ADAPTER_ON_DELAY_MS = 5000L;
    private static final long PROFILE_GRACE_MS = 7000L;
    private static final long ATTEMPT_TIMEOUT_MS = 15000L;
    private static final long VERIFY_AFTER_LINK_MS = 8000L;
    private static final long BATTERY_PROBE_DELAY_MS = 20000L;
    private static final long BATTERY_PROBE_TIMEOUT_MS = 15000L;
    private static final long PROXY_WAIT_MS = 1200L;
    private static final long HISTORY_MIN_INTERVAL_MS = 10L * 60L * 1000L;

