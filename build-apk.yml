    private void ensureProxies() {
        if (adapter == null || !adapterOn || !permissionOk) {
            return;
        }
        try {
            if (!a2dpRequested) {
                a2dpRequested = true;
                if (!adapter.getProfileProxy(app, serviceListener, BluetoothProfile.A2DP)) {
                    a2dpRequested = false;
                }
            }
            if (!hfpRequested) {
                hfpRequested = true;
                if (!adapter.getProfileProxy(app, serviceListener, BluetoothProfile.HEADSET)) {
                    hfpRequested = false;
                }
            }
        } catch (SecurityException e) {
            permissionOk = false;
        }
    }

    private void closeProxies() {
        if (adapter != null) {
            try {
                if (a2dp != null) {
                    adapter.closeProfileProxy(BluetoothProfile.A2DP, a2dp);
                }
                if (hfp != null) {
                    adapter.closeProfileProxy(BluetoothProfile.HEADSET, hfp);
                }
            } catch (RuntimeException e) {
                // ignore
            }
        }
        a2dp = null;
        hfp = null;
        a2dpUsable = false;
        hfpUsable = false;
        a2dpRequested = false;
        hfpRequested = false;
    }

