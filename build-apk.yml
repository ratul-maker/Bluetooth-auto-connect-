    // ------------------------------------------------------------------ lifecycle

    /**
     * @param active true for holders that are allowed to trigger automatic connection attempts
     *               (the monitoring service and the visible main screen). Passive holders (the
     *               device list, history, Quick Settings tile peeking) only observe.
     */
    public void acquire(boolean active) {
        acquireCount++;
        if (active) {
            activeCount++;
        }
        if (acquireCount == 1) {
            startUp();
        } else if (active && activeCount == 1) {
            onActiveStarted();
        }
    }

    public void release(boolean active) {
        if (acquireCount == 0) {
            return;
        }
        acquireCount--;
        if (active && activeCount > 0) {
            activeCount--;
        }
        if (acquireCount == 0) {
            activeCount = 0;
            shutDown();
        } else if (active && activeCount == 0) {
            cancelPendingAttempt();
            gaveUp = false;
            publish();
        }
    }

    private void onActiveStarted() {
        if (startupSettled && !isConnectedNow() && canAutoConnect() && !pending && !inFlight) {
            failedAttempts = 0;
            gaveUp = false;
            schedulePending("Monitoring started", 3000L);
        }
    }

    public void addListener(Listener l) {
        if (!listeners.contains(l)) {
            listeners.add(l);
        }
    }

    public void removeListener(Listener l) {
        listeners.remove(l);
    }

    private void startUp() {
        adapter = BtUtil.adapter(app);
        permissionOk = BtUtil.hasPermission(app);
