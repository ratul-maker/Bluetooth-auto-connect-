        prefAddress = prefs.preferredAddress();
        prefName = prefs.preferredName();
        wasConnected = false;
        connectedSince = 0L;
        aclState = Snapshot.ACL_UNKNOWN;
        linkedNoAudio = false;
        a2dpState = BluetoothProfile.STATE_DISCONNECTED;
        hfpState = BluetoothProfile.STATE_DISCONNECTED;
        a2dpPlaying = null;
        inFlight = false;
        pending = false;
        nextAttemptAt = 0L;
        failedAttempts = 0;
        gaveUp = false;
        classicNoted = false;
        batLive = false;
        batProbeState = 0;
        startupSettled = false;
        registerReceivers();
        ensureProxies();
        h.removeCallbacks(initialCheckRunnable);
        h.postDelayed(initialCheckRunnable, STARTUP_SETTLE_MS);
        publish();
    }

    private void shutDown() {
        unregisterReceivers();
        cancelAllTimers();
        if (attemptProbe != null) {
            attemptProbe.cancel();
            attemptProbe = null;
        }
        if (batteryProbe != null) {
            batteryProbe.cancel();
            batteryProbe = null;
        }
        inFlight = false;
        closeProxies();
    }

    private boolean readAdapterOn() {
        try {
            return adapter != null && permissionOk && adapter.isEnabled();
