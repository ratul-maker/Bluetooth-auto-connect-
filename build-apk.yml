android {
    namespace 'com.btearbuds.autoconnect'
    compileSdk 34

    defaultConfig {
        applicationId 'com.btearbuds.autoconnect'
        minSdk 26
        // Android 11 (API 30) is the primary target. Behaviour on newer Android is not tested.
        targetSdk 30
        versionCode 1
        versionName '1.0.0'
    }

    // Personal-use signing key (kept in the repo so every build is signed the same way and
    // updates install over each other). Do not publish this app to a store with this key.
    signingConfigs {
        release {
            storeFile rootProject.file('signing/btearbuds-release.jks')
            storeType 'pkcs12'
            storePassword 'btearbuds'
            keyAlias 'btearbuds'
            keyPassword 'btearbuds'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

// No third-party dependencies on purpose: smaller, offline, nothing to track you.
