name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack the project and make a fresh signing key
        run: |
          unzip -q EarbudsAutoConnect-project.zip -d project
          rm -f project/signing/btearbuds-release.jks
          keytool -genkeypair -keystore project/signing/btearbuds-release.jks -storetype PKCS12 -alias btearbuds -storepass btearbuds -keypass btearbuds -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Earbuds Auto-Connect, O=Personal use, C=US"
      - name: Build the APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee ../build.log
      - name: Check the APK
        run: |
          APK=project/app/build/outputs/apk/release/app-release.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          { "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose "$APK"; "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label:)"; ls -l "$APK"; } 2>&1 | tee -a build.log
          cp "$APK" EarbudsAutoConnect.apk
      - name: Publish the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" EarbudsAutoConnect.apk --title "Earbuds Auto-Connect (build ${{ github.run_number }})" --notes "Signed APK. Tap EarbudsAutoConnect.apk, then install it."
      - name: Save a short report so Claude can read what happened
        if: always()
        run: |
          mkdir -p /tmp/report && cd /tmp/report
          printf 'build %s\nresult: %s\ncommit: %s\n' "${{ github.run_number }}" "${{ job.status }}" "${{ github.sha }}" > status.txt
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            grep -nE "error:|FAILED|What went wrong|Caused by|Could not|AAPT" "$GITHUB_WORKSPACE/build.log" | head -80 > errors.txt || true
            tail -n 250 "$GITHUB_WORKSPACE/build.log" > build-tail.txt
          fi
          git init -q -b build-logs && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "report ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
